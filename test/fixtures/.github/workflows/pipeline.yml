name: Release Pipeline

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, develop]
    paths: ['src/**']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Test
        run: |
          npm test
          npm run lint
          npm run typecheck

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Notify
        if: failure()
        run: ./scripts/notify.sh "${{ secrets.SLACK_WEBHOOK }}"

  docs:
    uses: ./.github/workflows/docs.yml
    needs: [test]
