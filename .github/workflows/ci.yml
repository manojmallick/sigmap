name: CI

on:
  push:
    branches: [develop, main]
  # No `branches` filter on pull_request. It used to be [develop, main], which
  # meant a STACKED pr — one whose base is another feature branch — matched
  # nothing and ran only the external Snyk check. Required checks could then
  # never be satisfied, so the PR sat BLOCKED with no way to go green until the
  # branch below it merged. Running CI for every PR costs a few extra minutes
  # and removes a trap that silently skipped the test matrix.
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Bundle integrity (src/ modules present in gen-context.js __factories)
        run: node scripts/check-bundle.mjs
      - name: Bundle reproducibility (committed gen-context.js == fresh build from src/)
        run: node scripts/build-bundle.mjs --check
      - name: Metrics single-source-of-truth (latest.json → version.json + README)
        run: npm run check:metrics
      - name: Run unit tests
        run: node test/run.js
      - name: Run Python AST extractor tests
        run: npm run test:python
      - name: Run integration tests
        run: node test/integration/all.js
      - name: Retrieval quality gate (leak-free hard corpus)
        run: npm run validate:retrieval
      - name: Grounding regression gate (labelled good/bad fixtures)
        run: npm run validate:grounding

  # Retrieval scored on third-party repositories pinned to exact commits, against
  # a corpus labelled before any ranker run (#892). Every other retrieval gate
  # scores a corpus this project wrote or can influence, so a regression on a
  # repo we do not control could ship green. One Node version is enough: the gate
  # measures ranking, not the runtime matrix.
  xrepo:
    name: Third-party retrieval gate (xrepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The pinned repos are gitignored. Keyed on the manifest, so a re-pin or a
      # new repo invalidates it; fetch-xrepo-repos.mjs fetches only what is
      # missing or off-pin, so a partial restore still saves most of the download.
      - name: Cache pinned third-party repos
        uses: actions/cache@v4
        with:
          path: benchmarks/repos
          key: xrepo-repos-${{ hashFiles('benchmarks/xrepo-repos.json') }}
          restore-keys: xrepo-repos-
      - name: Fetch pinned repos
        run: node scripts/fetch-xrepo-repos.mjs
      - name: Third-party retrieval gate (zero-config, labelled corpus)
        run: npm run validate:xrepo -- --require-repos
