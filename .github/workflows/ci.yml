name: CI

on:
  push:
    branches: [develop, main]
  # No `branches` filter on pull_request. It used to be [develop, main], which
  # meant a STACKED pr — one whose base is another feature branch — matched
  # nothing and ran only the external Snyk check. Required checks could then
  # never be satisfied, so the PR sat BLOCKED with no way to go green until the
  # branch below it merged. Running CI for every PR costs a few extra minutes
  # and removes a trap that silently skipped the test matrix.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Workflow hygiene (actions pinned to a commit SHA, default token read-only)
        run: npm run check:workflows
      - name: Bundle integrity (src/ modules present in gen-context.js __factories)
        run: node scripts/check-bundle.mjs
      - name: Bundle reproducibility (committed gen-context.js == fresh build from src/)
        run: node scripts/build-bundle.mjs --check
      - name: Metrics single-source-of-truth (latest.json → version.json + README)
        run: npm run check:metrics
      - name: Run unit tests
        run: node test/run.js
      - name: Run Python AST extractor tests
        run: npm run test:python
      - name: Run integration tests
        run: node test/integration/all.js
      - name: Retrieval quality gate (leak-free hard corpus)
        run: npm run validate:retrieval
      - name: Grounding regression gate (labelled good/bad fixtures)
        run: npm run validate:grounding

  # Retrieval scored on third-party repositories pinned to exact commits, against
  # a corpus labelled before any ranker run (#892). Every other retrieval gate
  # scores a corpus this project wrote or can influence, so a regression on a
  # repo we do not control could ship green. One Node version is enough: the gate
  # measures ranking, not the runtime matrix.
  xrepo:
    name: Third-party retrieval gate (xrepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # The pinned repos are gitignored. Keyed on the manifest, so a re-pin or a
      # new repo invalidates it; fetch-xrepo-repos.mjs fetches only what is
      # missing or off-pin, so a partial restore still saves most of the download.
      - name: Cache pinned third-party repos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: benchmarks/repos
          key: xrepo-repos-${{ hashFiles('benchmarks/xrepo-repos.json') }}
          restore-keys: xrepo-repos-
      - name: Fetch pinned repos
        run: node scripts/fetch-xrepo-repos.mjs
      - name: Third-party retrieval gate (zero-config, labelled corpus)
        run: npm run validate:xrepo -- --require-repos
      # Extraction recall against each language's own parser (CPython ast, Ruby Ripper),
      # on the same pinned clones (#983). The interpreters are the runner's own; a floor is
      # compared only with a run on the version it was recorded for. --require-reference makes
      # a runner whose Python or Ruby no recorded floor covers (or that lacks one) fail loudly
      # instead of passing without checking anything: record floors for the new version.
      - name: Extraction recall (floors against the reference parsers)
        run: npm run validate:extraction-recall -- --require-reference
      # A re-run reads an extraction cache (#971). The promise that makes it safe to ship: on each pinned
      # clone a cached run, cold or warm or after one changed file, writes exactly what a run without the
      # cache writes. Python is shadowed so every runner extracts the same way.
      - name: Warm-cache equivalence (cache on == cache off, byte for byte)
        run: npm run validate:warm-cache
        timeout-minutes: 45
      # What a re-run costs on Django, as CPU time with the runner and its load noted. Report-only: a shared
      # runner is too noisy to gate on; the figures are in the job log and the uploaded report.
      - name: Re-run cost on Django (report only)
        continue-on-error: true
        run: node scripts/run-perf-benchmark.mjs --repos django --runs 3 --save
      - name: Upload the perf report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-report
          path: benchmarks/reports/perf.json
          if-no-files-found: ignore
