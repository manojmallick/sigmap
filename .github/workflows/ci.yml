name: CI

on:
  push:
    branches: [develop, main]
  # No `branches` filter on pull_request. It used to be [develop, main], which
  # meant a STACKED pr — one whose base is another feature branch — matched
  # nothing and ran only the external Snyk check. Required checks could then
  # never be satisfied, so the PR sat BLOCKED with no way to go green until the
  # branch below it merged. Running CI for every PR costs a few extra minutes
  # and removes a trap that silently skipped the test matrix.
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Bundle integrity (src/ modules present in gen-context.js __factories)
        run: node scripts/check-bundle.mjs
      - name: Bundle reproducibility (committed gen-context.js == fresh build from src/)
        run: node scripts/build-bundle.mjs --check
      - name: Metrics single-source-of-truth (latest.json → version.json + README)
        run: npm run check:metrics
      - name: Run unit tests
        run: node test/run.js
      - name: Run Python AST extractor tests
        run: npm run test:python
      - name: Run integration tests
        run: node test/integration/all.js
      - name: Retrieval quality gate (leak-free hard corpus)
        run: npm run validate:retrieval
      - name: Grounding regression gate (labelled good/bad fixtures)
        run: npm run validate:grounding
