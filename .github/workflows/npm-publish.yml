name: Release — Core (npm + GitHub Packages)

on:
  push:
    tags:
      - 'v[0-9]*'
  # Manual re-publish path (e.g. after a failed tag run): dispatch from a ref
  # whose package.json carries the version to publish. Tag-only jobs skip.
  workflow_dispatch:

# Read-only by default; each job below asks for the scopes it needs (#1000).
permissions:
  contents: read

jobs:
  # ── 1. Gate: all tests must pass ─────────────────────────────────────────
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run test suite
        run: node test/run.js

  # ── 2. Publish to npmjs.com ───────────────────────────────────────────────
  # Auth is npm Trusted Publishing (OIDC): the npmjs.com package settings
  # trust this repo + workflow file, so no NPM_TOKEN secret exists to expire
  # (the classic-token 404-on-PUT failure class, v8.28.1). Requires npm ≥ 11.5.1.
  publish-npm:
    name: Publish → npmjs.com
    needs: test
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC) + provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Verify package version matches tag
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✓ version check passed: $PKG_VERSION"

      - name: Show version to publish (manual dispatch)
        if: github.ref_type != 'tag'
        run: echo "Publishing package.json version $(node -p "require('./package.json').version") from ${GITHUB_REF_NAME}"

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --provenance --access public

  # ── 3. Publish to GitHub Packages (scoped) ───────────────────────────────
  publish-github:
    name: Publish → GitHub Packages
    needs: test
    permissions:
      contents: read
      packages: write   # GitHub Packages
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@manojmallick'

      - name: Publish to GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@manojmallick/sigmap';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Create GitHub Release (npm only) ──────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [publish-npm, publish-github]
    permissions:
      contents: write   # create GitHub Releases
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          make_latest: true
