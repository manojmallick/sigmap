name: MCP host compatibility

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install current host CLIs
        run: npm install --global @anthropic-ai/claude-code @openai/codex opencode-ai
      - name: Verify each host reads its generated SigMap config
        env:
          SIGMAP_REQUIRE_HOST_CLIS: '1'
        run: node test/integration/mcp/host-readers.test.js
