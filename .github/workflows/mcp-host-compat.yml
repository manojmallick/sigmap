name: MCP host compatibility

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install current host CLIs
        run: npm install --global @anthropic-ai/claude-code @openai/codex opencode-ai
      - name: Verify each host reads its generated SigMap config
        env:
          SIGMAP_REQUIRE_HOST_CLIS: '1'
        run: node test/integration/mcp/host-readers.test.js
